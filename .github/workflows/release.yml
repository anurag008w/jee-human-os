name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v2026.08.01)"
        required: false
        default: ""
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]+"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "anurag008w@users.noreply.github.com"
          git config user.name "anurag008w"

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version }}"
            if [[ -z "$VERSION" ]]; then
              # AUDIT FIX: kabhi plain-date tag (vYYYY.MM.DD) auto-default mat
              # banao — build-number tag ke baad wo versionCode ko GHATA deta hai
              # (2026097003 -> 2026090600) aur Android downgrade protection
              # update install hone se rok deta hai. Default = latest BUILD-scheme
              # tag ka next number (vYYYY.MM.XXXX).
              LATEST_BUILD_TAG=$(git tag --list 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]' | sort -V | tail -1 || true)
              if [[ -z "$LATEST_BUILD_TAG" ]]; then
                VERSION="v$(date +%Y.%m.)7000"
              else
                NEXT_BUILD=$(( "${LATEST_BUILD_TAG##*.}" + 1 ))
                VERSION="v$(date +%Y.%m.)${NEXT_BUILD}"
              fi
            fi
            if [[ ! "$VERSION" =~ ^v ]]; then
              VERSION="v$VERSION"
            fi
          fi
          VERSION_NAME="${VERSION#v}"

          # versionCode: always YYYYMMDDSS (10-digit, zero-padded) so it can
          # only go up. Day-only tags (vYYYY.MM.DD) get SEQ=00; same-day
          # sequenced tags (vYYYY.MM.DDSS) keep their real SEQ. Naively
          # stripping dots (old approach) breaks monotonicity the moment a
          # plain-date tag follows a same-day-sequence tag — e.g.
          # 2026.08.0503 -> code 2026080503, then 2026.08.06 -> code
          # 20260806, a DECREASE — and Android's downgrade protection then
          # silently refuses to install the "update" over the existing app.
          YEAR="${VERSION_NAME%%.*}"
          REST="${VERSION_NAME#*.}"
          MONTH="${REST%%.*}"
          DAYSEQ="${REST#*.}"
          if [[ ${#DAYSEQ} -gt 2 ]]; then
            DAY="${DAYSEQ:0:2}"
            SEQ="${DAYSEQ:2:2}"
          else
            DAY="$DAYSEQ"
            SEQ="00"
          fi
          VERSION_CODE="${YEAR}${MONTH}${DAY}${SEQ}"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📌 Release: $VERSION (versionCode $VERSION_CODE)"

      - name: Verify package.json matches release tag
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [[ "${{ steps.version.outputs.VERSION_NAME }}" != "$PKG_VERSION" ]]; then
            echo "❌ package.json version ($PKG_VERSION) does NOT match release tag (${{ steps.version.outputs.VERSION_NAME }})"
            echo "   Ye tab hota hai jab tag version-bump commit se pehle wale commit par lagaya gaya ho."
            echo "   Pehle release.sh se version bump karo ya tag ko bump commit par shift karo."
            exit 1
          fi
          echo "✅ package.json version ($PKG_VERSION) matches release tag"

      - name: Determine previous tag
        id: prev_tag
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${VERSION}$" | head -1 || echo "")
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "📎 Previous tag for changelog comparison: $PREVIOUS_TAG"

      - name: Create tag
        if: github.event_name != 'push'
        run: |
          if git tag | grep -q "^${{ steps.version.outputs.VERSION }}$"; then
            git tag -d "${{ steps.version.outputs.VERSION }}"
          fi
          git tag -a "${{ steps.version.outputs.VERSION }}" -m "Release ${{ steps.version.outputs.VERSION }}"
          git push origin "${{ steps.version.outputs.VERSION }}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION_NAME }}
          VITE_DEFAULT_AI_BASE_URL: ${{ secrets.VITE_DEFAULT_AI_BASE_URL }}
          VITE_DEFAULT_AI_API_KEY: ${{ secrets.VITE_DEFAULT_AI_API_KEY }}
          VITE_DEFAULT_AI_MODEL: ${{ secrets.VITE_DEFAULT_AI_MODEL }}
          VITE_DEFAULT_AI_MODELS: ${{ secrets.VITE_DEFAULT_AI_MODELS }}
          VITE_DEFAULT_AI_TEMPERATURE: ${{ secrets.VITE_DEFAULT_AI_TEMPERATURE }}
          VITE_DEFAULT_AI_MAX_TOKENS: ${{ secrets.VITE_DEFAULT_AI_MAX_TOKENS }}
          VITE_DEFAULT_AI_TIMEOUT_MS: ${{ secrets.VITE_DEFAULT_AI_TIMEOUT_MS }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup signing
        id: setup_signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            echo "$KEYSTORE" | base64 -d > android/app/release-keystore.jks
            echo "storeFile=release-keystore.jks" > android/keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/keystore.properties
            echo "keyAlias=levelup" >> android/keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/keystore.properties
            echo "storeType=pkcs12" >> android/keystore.properties
            echo "SIGNED=true" >> $GITHUB_OUTPUT
          else
            echo "SIGNED=false" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK
        if: steps.setup_signing.outputs.SIGNED == 'true'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${{ steps.version.outputs.VERSION_NAME }}" \
            -PversionCode="${{ steps.version.outputs.VERSION_CODE }}"

      - name: Build debug APK
        if: steps.setup_signing.outputs.SIGNED != 'true'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon \
            -PversionName="${{ steps.version.outputs.VERSION_NAME }}" \
            -PversionCode="${{ steps.version.outputs.VERSION_CODE }}"

      - name: Prepare APK
        id: prepare
        run: |
          mkdir -p release-out
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [[ "${{ steps.setup_signing.outputs.SIGNED }}" == "true" ]]; then
            APK_NAME="levelup-${{ steps.version.outputs.VERSION_NAME }}-signed.apk"
            cp android/app/build/outputs/apk/release/app-release.apk "release-out/${APK_NAME}"
          else
            APK_NAME="levelup-${{ steps.version.outputs.VERSION_NAME }}.apk"
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-out/${APK_NAME}"
          fi
          echo "apk_path=release-out/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          LAST_TAG="${{ steps.prev_tag.outputs.PREVIOUS_TAG }}"
          
          cat > changelog.md << 'CHANGELOG'
          # Release ${{ steps.version.outputs.VERSION }}

          ## 📱 Download APK
          Install the APK on your Android device.

          **Note:** Enable 'Install from unknown sources' in phone settings.

          - **APK:** `${{ steps.prepare.outputs.apk_name }}`
          CHANGELOG

          if [[ "${{ steps.setup_signing.outputs.SIGNED }}" == "true" ]]; then
            echo "" >> changelog.md
            echo "✅ **Signed Release APK** - Less likely to show 'harmful' warnings" >> changelog.md
          fi

          cat >> changelog.md << 'CHANGELOG'

          ## 📝 Changes

          CHANGELOG

          if [[ -n "$LAST_TAG" ]]; then
            echo "### Changes since $LAST_TAG" >> changelog.md
            git log $LAST_TAG..HEAD --format="- %s" >> changelog.md
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: levelup-${{ steps.version.outputs.VERSION_NAME }}-apk
          path: |
            ${{ steps.prepare.outputs.apk_path }}
          retention-days: 30

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "LevelUp ${{ steps.version.outputs.VERSION }}"
          body_path: changelog.md
          files: |
            ${{ steps.prepare.outputs.apk_path }}

      - name: Done
        run: |
          echo "🎉 Release ${{ steps.version.outputs.VERSION }} created!"
          echo "📦 APK: ${{ steps.prepare.outputs.apk_name }}"
